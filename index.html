<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>S Square Marketing Pvt. Ltd. & S Square Ventures</h1>
        <p>Sales & Performance Analysis</p>
    </div>

    <!-- FILTERS -->
    <div class="filters">

        <select id="typeFilter">
            <option value="">All Type</option>
        </select>

        <select id="agentFilter">
            <option value="">All Agent</option>
        </select>

        <select id="brandFilter">
            <option value="">All Brand</option>
        </select>

        <select id="dealerFilter">
            <option value="">All Dealer</option>
        </select>

        <select id="monthFilter">
            <option value="">All Month</option>
        </select>

        <select id="yearFilter">
            <option value="">All Year</option>
        </select>

        <select id="quarterFilter">
            <option value="">All FY Quarter</option>
        </select>

        <select id="fyFilter">
            <option value="">All F Year</option>
        </select>

        <select id="seasonFilter">
            <option value="">All Season</option>
        </select>

    </div>


    <!-- KPI CARDS -->
    <div class="cards">

        <div class="card">
            <div class="card-title">TOTAL VALUE</div>
            <div class="card-value" id="totalValue">₹ 0</div>
        </div>

        <div class="card">
            <div class="card-title">TOTAL QUANTITY</div>
            <div class="card-value" id="totalQty">0</div>
        </div>

        <div class="card">
            <div class="card-title">TOTAL INVOICES</div>
            <div class="card-value" id="totalInvoices">0</div>
        </div>

        <div class="card">
            <div class="card-title">TOTAL DEALERS</div>
            <div class="card-value" id="totalDealers">0</div>
        </div>

    </div>


    <!-- CHARTS -->
    <div class="charts">

        <div class="chart-box">
            <h2>Brand Wise Value</h2>
            <canvas id="brandChart"></canvas>
        </div>

        <div class="chart-box">
            <h2>Month Wise Value</h2>
            <canvas id="monthChart"></canvas>
        </div>

    </div>


    <div class="charts">

        <div class="chart-box">
            <h2>Agent Wise Value</h2>
            <canvas id="agentChart"></canvas>
        </div>

        <div class="chart-box">
            <h2>Dealer Wise Value</h2>
            <canvas id="dealerChart"></canvas>
        </div>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
